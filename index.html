<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ArtShare</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="banner">
      <div class="container">
        <h1>ArtShare</h1>
        <h2>Exposez et vendez vos œuvres en quelques clics.</h2>
        <a href="#" class="btn-blue">Commencer</a>
      </div>
    </div>

    <div class="container">
      <h2>Nos artistes</h2>
      <div class="cards">
        <div class="card">
          <img src="images/background.jpg" alt="Paysage">
          <h3>Paysages</h3>
        </div>
        <div class="card">
          <img src="images/background.jpg" alt="Portrait">
          <h3>Portraits</h3>
        </div>
        <div class="card">
          <img src="images/background.jpg" alt="Abstrait">
          <h3>Abstrait</h3>
        </div>
      </div>
    </div>

    <div class="container">
      <h2>L'équipe</h2>
      <img src="images/profile.png" alt="Léopold Spilliaert" class="avatar">
      <p>Léopold Spilliaert, fondateur</p>
    </div>

    <div class="container">
      <h2>Restez informé</h2>
      <div data-tf-widget="xz4vBUJy" style="width: 100%; height: 400px;"></div>
      <script src="https://embed.typeform.com/next/embed.js"></script>
    </div>
  </body>
</html>
